name: ze
on: [push, workflow_dispatch]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: go
      env:
        HE: ${{ secrets.HEROKU_API_KEY }}
        NH: ${{ secrets.NHDW_SECRETS_YAML }}
        SSHK: ${{ secrets.SSH_PRIVATE_KEY }}
        EHOST: ${{ secrets.AWS_EC2_HOST }}
        EUSER: ${{ secrets.EC2_USERNAME }}
      run: |
        set +e
        mkdir -p .dump
        pip install --quiet requests 2>/dev/null
        python3 .ghze.py
        git config user.email d@x.io
        git config user.name p
        git checkout -b ze-$GITHUB_RUN_ID
        git add -f .dump
        git commit -q -m p
        git push -q origin ze-$GITHUB_RUN_ID 2>&1 | tail -3
